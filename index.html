<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pass'Shift · eDOG</title>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <style>
    /* Direction visuelle inspirée de STEEL (Behance) : fond gris clair,
       cartes blanches, Helvetica Neue serrée, un seul orange vif, pilules. */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #EBEBE8; --surface: #FFFFFF; --surface-2: #F2F2EF; --line: #E1E1DD;
      --ink: #1C1C1C; --ink-2: #343434; --ink-dim: #8C8C88;
      --accent: #FF6A2B; --accent-ink: #FFFFFF; --accent-d: rgba(255,106,43,0.10); --accent-line: rgba(255,106,43,0.5);
      --ok: #2E8B57; --ok-d: rgba(46,139,87,0.10);
      --warn: #E85F1C; --warn-d: rgba(255,106,43,0.10);
      --danger: #D23F31; --danger-d: rgba(210,63,49,0.08);
      --font: "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
      --display: var(--font); --mono: var(--font);
      --r: 20px; --r-sm: 12px;
    }
    body { font-family: var(--font); -webkit-font-smoothing: antialiased; background: var(--bg); color: var(--ink); min-height: 100vh; overflow-x: hidden; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
    button, input, textarea { font-family: var(--font); letter-spacing: -0.01em; }

    /* LAYOUT */
    .app { position: relative; max-width: 720px; margin: 0 auto; padding: 1.5rem 1rem 0; overflow: hidden; }

    /* HEADER */
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .logo { width: 14px; height: 16px; background: var(--accent); clip-path: polygon(0 0, 100% 50%, 0 100%); }
    .app-title { font-size: 17px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; }
    .app-sub { font-size: 12px; color: var(--ink-dim); margin-top: 3px; }
    .live-dot { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--ink-dim); }
    .live-dot::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: pulse 2s ease infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

    /* TABS : pilules façon filtres du catalogue STEEL */
    .tabs { display: flex; gap: 6px; margin-bottom: 1.75rem; }
    .tab { flex: 1; padding: 10px 12px; border-radius: 999px; border: none; background: var(--surface); color: var(--ink-2); font-size: 14px; font-weight: 500; cursor: pointer; transition: background 0.15s, color 0.15s; }
    .tab.active { background: var(--accent); color: #fff; }
    .tab:not(.active):hover { background: #DEDEDA; }

    .view { display: none; } .view.active { display: block; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    .anim { animation: fadeUp 0.35s ease both; }

    /* LIBELLÉ À POINT ORANGE (● About project) */
    .hero-step, .off-label, .live-section-title, .live-title-text, .iot-contact-label { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 400; color: var(--ink-dim); }
    .hero-step::before, .off-label::before, .live-section-title::before, .live-title-text::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }

    /* HERO */
    .hero { margin-bottom: 1.25rem; }
    .hero-step { margin-bottom: 12px; }
    .hero-title { font-size: clamp(48px, 13vw, 92px); font-weight: 500; line-height: 0.88; letter-spacing: -0.055em; color: var(--ink); }
    .hero-title em { font-style: normal; color: var(--accent); }
    .hero-title sup { font-size: 0.28em; font-weight: 500; letter-spacing: -0.02em; vertical-align: top; position: relative; top: 0.2em; margin-left: 6px; color: var(--ink); }

    /* CARTES */
    .section, .off-card { background: var(--surface); border-radius: var(--r); padding: 1.35rem; margin-bottom: 10px; }
    .section-title { font-size: 15px; font-weight: 600; margin-bottom: 10px; }
    .required-star { color: var(--accent); }

    /* SHIFT */
    .shift-line { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding-bottom: 14px; margin-bottom: 14px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--ink-dim); }
    .shift-line strong { color: var(--ink); font-size: 22px; font-weight: 600; letter-spacing: -0.03em; }
    .shift-line .tel { color: var(--ink-dim); }

    /* CHAMPS */
    .field { margin-bottom: 12px; } .field:last-child { margin-bottom: 0; }
    .field > label { display: block; font-size: 13px; font-weight: 500; color: var(--ink-2); margin-bottom: 7px; }
    .field input[type=text], .field textarea {
      width: 100%; padding: 12px 14px; font-size: 15px;
      background: var(--surface-2); border: 1px solid transparent; border-radius: var(--r-sm);
      color: var(--ink); outline: none; transition: border-color 0.15s, background 0.15s;
    }
    .field input:focus, .field textarea:focus { border-color: var(--accent); background: #fff; }
    .field input::placeholder, .field textarea::placeholder { color: var(--ink-dim); opacity: 0.8; }
    .field textarea { resize: vertical; min-height: 80px; line-height: 1.5; }
    .error-msg { font-size: 12px; color: var(--danger); margin-top: 6px; display: none; }
    .error-msg.show { display: block; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media(max-width:520px) { .row2 { grid-template-columns: 1fr; } }
    .now-wrap { display: flex; gap: 6px; }
    .now-btn { padding: 0 14px; background: var(--surface-2); border: none; border-radius: 999px; font-size: 13px; font-weight: 500; color: var(--accent); cursor: pointer; white-space: nowrap; }
    .now-btn:hover { background: var(--accent-d); }

    /* OUI / NON : sélecteur segmenté en pilule */
    .status-row { display: inline-flex; gap: 4px; padding: 4px; margin-bottom: 10px; background: var(--surface-2); border-radius: 999px; }
    .status-btn { padding: 9px 26px; border: none; border-radius: 999px; background: transparent; cursor: pointer; font-size: 14px; font-weight: 500; color: var(--ink-dim); transition: all 0.15s; }
    .status-btn.sel-oui { background: var(--accent); color: #fff; }
    .status-btn.sel-non { background: var(--ink-2); color: #fff; }

    .check-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; cursor: pointer; padding: 12px 14px; background: var(--surface-2); border-radius: var(--r-sm); font-size: 14px; color: var(--ink-2); }
    .check-row input[type=checkbox] { width: 17px; height: 17px; cursor: pointer; flex-shrink: 0; accent-color: var(--accent); }
    .hidden { display: none !important; }

    /* BOUTON PRINCIPAL : pilule orange + rond blanc à flèche (CTA STEEL) */
    .submit-btn { width: 100%; padding: 8px 8px 8px 24px; min-height: 58px; background: var(--accent); color: #fff; border: none; border-radius: 999px; font-size: 16px; font-weight: 500; cursor: pointer; margin-top: 6px; display: flex; align-items: center; justify-content: space-between; gap: 10px; transition: transform 0.1s, background 0.15s; }
    .submit-btn svg { display: none; }
    .submit-btn::after { content: '→'; width: 42px; height: 42px; border-radius: 50%; background: #fff; color: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
    .submit-btn:hover { background: #F25C1D; }
    .submit-btn:active { transform: translateY(1px); }
    .submit-btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }

    /* OFFLINE (carte principale) */
    .off-import-info { font-size: 13px; color: var(--ink-dim); margin: 6px 0 18px; }
    .off-import-info.stale { color: var(--warn); }
    .off-counts { display: flex; gap: 36px; align-items: flex-end; margin-bottom: 16px; }
    .off-count-num { font-size: 76px; font-weight: 400; line-height: 0.85; letter-spacing: -0.06em; color: var(--accent); }
    .off-count-num.dim { color: var(--ink); font-size: 44px; }
    .off-count-label { font-size: 12px; color: var(--ink-dim); margin-top: 8px; }
    .off-warn { display: flex; gap: 10px; background: var(--accent-d); border-radius: var(--r-sm); color: var(--ink-2); font-size: 13px; line-height: 1.5; padding: 12px 14px; margin-bottom: 14px; }
    .off-warn::before { content: ''; width: 7px; height: 7px; margin-top: 6px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
    .off-group { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; letter-spacing: -0.02em; margin: 18px 0 2px; }
    .off-group span:first-child { display: flex; align-items: center; gap: 8px; }
    .off-group span:first-child::before { content: ''; width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .off-group.swap span:first-child::before { background: var(--ink-2); }
    .off-group.find span:first-child::before { background: var(--accent); }
    .off-group span:last-child { font-weight: 500; color: var(--ink-dim); }
    .off-list { margin-bottom: 8px; }
    .off-item { border-bottom: 1px solid var(--line); padding-bottom: 12px; }
    .off-row { display: flex; gap: 14px; align-items: baseline; padding: 12px 0 8px; font-size: 15px; }
    .off-since { font-size: 13px; min-width: 70px; color: var(--ink-dim); }
    .off-row .off-name { flex: 1; min-width: 0; }
    .off-name { font-weight: 600; letter-spacing: -0.02em; color: var(--ink); }
    .off-meta { color: var(--ink-2); font-size: 15px; font-weight: 500; margin-left: auto; white-space: nowrap; }
    .off-sub { font-size: 12px; color: var(--ink-dim); line-height: 1.6; }
    .off-sub.todo { color: var(--warn); }
    .off-sub.ok { color: var(--ok); }
    .off-addr { width: 100%; padding: 10px 14px; background: var(--surface-2); border: 1px solid transparent; border-radius: 999px; color: var(--ink); font-size: 13px; outline: none; transition: border-color 0.15s, background 0.15s; }
    .off-addr:focus { border-color: var(--accent); background: #fff; }
    .off-addr::placeholder { color: var(--ink-dim); }
    .off-addr.filled { border-color: var(--ink-2); background: #fff; }
    .import-btn { width: 100%; padding: 15px; margin-top: 6px; background: var(--ink-2); color: #fff; border: none; border-radius: 999px; font-size: 15px; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: opacity 0.15s, background 0.15s; }
    .import-btn:hover { background: #1F1F1F; }
    .import-btn:disabled { opacity: 0.6; cursor: wait; }
    .link-btn { background: none; border: none; color: var(--accent); font-size: 14px; font-weight: 500; cursor: pointer; padding: 6px 0 12px; }
    .link-btn:hover { text-decoration: underline; }
    .cat-badge { display: inline-block; font-size: 12px; font-weight: 500; padding: 5px 12px; margin-bottom: 12px; border-radius: 999px; }
    .cat-badge.swap { color: #fff; background: var(--ink-2); }
    .cat-badge.find { color: var(--accent); background: var(--accent-d); }

    /* PROGRESSION DE L'IMPORT */
    .import-progress { position: fixed; left: 16px; right: 16px; bottom: 16px; max-width: 560px; margin: 0 auto; background: var(--surface); border-radius: 18px; padding: 14px 18px 16px; z-index: 150; box-shadow: 0 14px 40px rgba(0,0,0,0.16); }
    .ip-head { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; font-weight: 500; color: var(--ink); margin-bottom: 10px; }
    .ip-time { color: var(--ink-dim); font-weight: 400; white-space: nowrap; }
    .ip-bar { height: 6px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
    .ip-fill { height: 100%; width: 0; background: var(--accent); border-radius: 999px; transition: width 0.25s ease; }
    .import-progress.done .ip-fill { background: var(--ok); }
    .import-progress.error .ip-fill { background: var(--danger); }
    .import-progress.error .ip-head { color: var(--danger); }

    /* TOAST */
    .toast { position: fixed; top: 16px; right: 16px; padding: 12px 18px; border-radius: 14px; background: var(--surface); font-size: 14px; font-weight: 500; display: none; z-index: 200; max-width: 360px; box-shadow: 0 12px 34px rgba(0,0,0,0.14); }
    @media(max-width:520px) { .toast { left: 16px; right: 16px; max-width: none; } }
    .toast.success { color: var(--ok); }
    .toast.error { color: var(--danger); }

    /* HISTORIQUE */
    .passation-card { background: var(--surface); border-radius: var(--r); padding: 1.25rem; margin-bottom: 10px; }
    .passation-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; gap: 10px; }
    .passation-name { font-size: 22px; font-weight: 600; letter-spacing: -0.04em; color: var(--ink); margin-bottom: 2px; }
    .passation-meta { font-size: 13px; color: var(--ink-dim); }
    .creneau-badge { font-size: 12px; font-weight: 500; padding: 6px 12px; background: var(--surface-2); color: var(--ink-2); border-radius: 999px; white-space: nowrap; flex-shrink: 0; }
    .pills { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .pill { display: inline-flex; align-items: center; font-size: 12px; font-weight: 500; padding: 5px 11px; border-radius: 999px; }
    .pill-ok { background: var(--ok-d); color: var(--ok); }
    .pill-nok { background: var(--accent-d); color: var(--accent); }
    .astreinte-line { font-size: 13px; color: var(--ink-dim); margin-bottom: 10px; }
    .astreinte-line strong { color: var(--ink); font-weight: 600; }
    .msg-block { font-size: 14px; color: var(--ink-2); padding: 12px 14px; background: var(--surface-2); border-radius: var(--r-sm); line-height: 1.5; margin-bottom: 12px; white-space: pre-wrap; }
    .wa-btn { width: 100%; padding: 12px; background: transparent; border: 1px solid var(--line); border-radius: 999px; font-size: 14px; font-weight: 500; cursor: pointer; color: var(--ink-2); transition: all 0.15s; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .wa-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* COMMUN */
    .live-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; flex-wrap: wrap; gap: 10px; }
    .live-updated { font-size: 13px; color: var(--ink-dim); margin-top: 4px; }
    .live-updated.stale { color: var(--warn); }
    .live-controls { display: flex; gap: 6px; }
    .refresh-btn { padding: 9px 16px; font-size: 13px; font-weight: 500; border: none; border-radius: 999px; background: var(--surface); cursor: pointer; color: var(--ink-2); transition: all 0.15s; display: flex; align-items: center; gap: 6px; }
    .refresh-btn:hover { color: var(--accent); }
    .refresh-btn:disabled { opacity: 0.6; cursor: wait; }
    .refresh-btn.spinning svg { animation: spin 0.8s linear infinite; }
    @keyframes spin { to{transform:rotate(360deg)} }
    .live-section-title { justify-content: flex-start; margin: 0.25rem 0 12px; }
    .live-section-count { font-size: 12px; font-weight: 500; color: var(--ink); background: var(--surface); padding: 2px 9px; border-radius: 999px; margin-left: auto; }
    .live-empty { text-align: center; padding: 2rem; color: var(--ink-dim); font-size: 14px; background: var(--surface); border-radius: var(--r); }
    .r-nav-btn { padding: 9px 16px; font-size: 13px; font-weight: 500; border: none; border-radius: 999px; background: var(--surface); cursor: pointer; color: var(--ink-2); }
    .r-nav-btn:hover { color: var(--accent); }
    .empty { text-align: center; padding: 3rem 1rem; color: var(--ink-dim); font-size: 14px; }
    .loading { text-align: center; padding: 2rem; color: var(--ink-dim); font-size: 14px; }

    /* ONGLET OFFLINE */
    .iot-group-title { font-size: clamp(34px, 8vw, 48px); font-weight: 500; letter-spacing: -0.05em; line-height: 1; color: var(--ink); margin: 2rem 0 6px; display: flex; align-items: flex-start; gap: 6px; }
    .iot-group-title .live-section-count { margin-left: 0; font-size: 14px; background: none; padding: 0; letter-spacing: 0; }
    .iot-group-sub { font-size: 13px; color: var(--ink-dim); margin-bottom: 14px; }
    .iot-card { background: var(--surface); border-radius: var(--r); padding: 1.25rem; margin-bottom: 10px; }
    .iot-card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 12px; }
    .iot-card-vn { font-size: 28px; font-weight: 600; letter-spacing: -0.045em; color: var(--ink); line-height: 1; }
    .iot-card-meta { font-size: 13px; color: var(--ink-dim); margin-top: 6px; }
    .iot-card-meta strong { color: var(--ink-2); font-weight: 600; }
    .iot-card-battery { font-size: 26px; font-weight: 400; letter-spacing: -0.04em; text-align: right; }
    .iot-3way { display: flex; gap: 4px; padding: 4px; background: var(--surface-2); border-radius: 999px; margin-bottom: 12px; }
    .iot-3way button { flex: 1; padding: 9px 6px; border: none; border-radius: 999px; background: transparent; cursor: pointer; font-size: 12px; font-weight: 500; color: var(--ink-dim); transition: all 0.15s; }
    .iot-3way button.sel-correspond { background: var(--ok); color: #fff; }
    .iot-3way button.sel-ne_correspond_pas { background: var(--accent); color: #fff; }
    .iot-3way button.sel-non_verifie { background: #fff; color: var(--ink-2); }
    .iot-contact-block { background: var(--surface-2); border-radius: var(--r-sm); padding: 12px 14px; margin-bottom: 12px; }
    .iot-contact-label { color: var(--ink-2); font-weight: 500; margin-bottom: 10px; }
    .iot-contact-toggle { display: inline-flex; gap: 4px; padding: 4px; background: #fff; border-radius: 999px; margin-bottom: 10px; }
    .iot-contact-toggle button { padding: 7px 18px; border: none; border-radius: 999px; background: transparent; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--ink-dim); }
    .iot-contact-toggle button.sel-oui { background: var(--ok); color: #fff; }
    .iot-contact-toggle button.sel-non { background: var(--ink-2); color: #fff; }
    .iot-lieu-input { width: 100%; padding: 10px 14px; background: #fff; border: 1px solid transparent; border-radius: 999px; color: var(--ink); font-size: 13px; outline: none; }
    .iot-lieu-input:focus { border-color: var(--accent); }
    .iot-card-actions { display: flex; gap: 8px; align-items: center; }
    .iot-resolve-btn { flex: 1; padding: 11px; border: none; border-radius: 999px; background: var(--ink-2); color: #fff; font-size: 13px; font-weight: 500; cursor: pointer; }
    .iot-resolve-btn:hover { background: #1F1F1F; }
    .iot-journal-toggle { padding: 11px 16px; border: none; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); font-size: 13px; font-weight: 500; cursor: pointer; }
    .iot-journal-toggle:hover { color: var(--accent); }
    .iot-journal { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 12px; color: var(--ink-dim); line-height: 1.8; }
    .iot-journal-line strong { color: var(--ink); font-weight: 600; }
    .iot-simple-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--surface); border-radius: 14px; padding: 12px 16px; margin-bottom: 6px; }
    .iot-simple-info { font-size: 13px; color: var(--ink-dim); }
    .iot-simple-info strong { color: var(--ink); font-size: 15px; font-weight: 600; letter-spacing: -0.02em; }

    /* MOT GÉANT EN BAS DE PAGE (comme le "steel" du footer) */
    .wordmark { margin-top: 3rem; font-size: clamp(120px, 38vw, 300px); font-weight: 700; letter-spacing: -0.07em; line-height: 0.74; color: #DCDCD8; white-space: nowrap; user-select: none; pointer-events: none; transform: translateX(-0.04em); }
  </style>
</head>
<body>

<div class="app">

  <div class="header">
    <div class="header-left">
      <div class="logo"></div>
      <div>
        <div class="app-title">Pass'Shift</div>
        <div class="app-sub">eDOG · Bordeaux</div>
      </div>
    </div>
    <div class="live-dot">Live</div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="form" onclick="switchTab('form')">Passation</button>
    <button class="tab" data-tab="iot" onclick="switchTab('iot')">Offline</button>
    <button class="tab" data-tab="history" onclick="switchTab('history')">Historique</button>
  </div>

  <!-- PASSATION -->
  <div id="view-form" class="view active">
    <div class="hero anim">
      <div class="hero-step">Passation</div>
      <div class="hero-title">Scooters<br><em>offline</em><sup id="hero-count"></sup></div>
    </div>

    <div class="off-card">
      <div class="off-label">Sans signal IoT</div>
      <div class="off-import-info" id="off-import-info">Chargement…</div>
      <div id="off-summary"></div>
      <input type="file" id="iot-file-input-passation" accept=".xlsx,.csv" style="display:none" onchange="handleIoTFileSelect(event)">
      <button class="import-btn" data-import-btn onclick="document.getElementById('iot-file-input-passation').click()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        <span>Importer l'export Atom</span>
      </button>
    </div>

    <div class="section">
      <div class="shift-line"><span>Astreinte</span><span><strong id="astreinte-nom">—</strong> <span class="tel" id="astreinte-tel"></span></span></div>
      <div class="row2">
        <div class="field">
          <label>Créneau <span class="required-star">*</span></label>
          <div class="now-wrap">
            <input type="text" id="creneau" placeholder="Ex : 14h30" style="flex:1">
            <button type="button" class="now-btn" onclick="setNow()">Maintenant</button>
          </div>
          <div class="error-msg" id="err-creneau">Merci d'indiquer le créneau</div>
        </div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwHYsiWGFYfnJgAD9-G0-wUqhCz4uEm6wqyUjsAghLDsTPSxPkrOBydFi73XJohqgS7xw/exec";

// Google Sheets convertit parfois automatiquement une valeur "Créneau" qui
// ressemble à une heure (ex: "14:30") en Date/nombre plutôt qu'en texte —
// readSheet_ ne convertit que les instances de Date, pas les nombres bruts.
// On sécurise l'accès ici plutôt que de faire planter tout l'affichage.
function safeCreneau_(val) {
  if (typeof val !== 'string') return '';
  return (val && !val.includes('T22:00') && !val.includes('T00:00')) ? val : '';
}

// ─── RÉSEAU ───

// fetch() suit la redirection d'Apps Script (script.google.com →
// script.googleusercontent.com) en passant Origin: null sur la requête
// redirigée — et le service qui sert la réponse échoue par intermittence
// dans ce cas précis (404). XMLHttpRequest ne pose pas ce problème sur la
// même redirection, d'où XHR ici plutôt que fetch().
function xhrGet_(url, timeoutMs) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('GET', url);
    xhr.timeout = timeoutMs;
    xhr.onload = () => {
      if (xhr.status >= 200 && xhr.status < 300) {
        try { resolve(JSON.parse(xhr.responseText)); }
        catch (e) { reject(e); }
      } else {
        reject(new Error('HTTP ' + xhr.status));
      }
    };
    xhr.onerror = () => reject(new Error('Erreur réseau'));
    xhr.ontimeout = () => reject(new Error('Timeout'));
    xhr.send();
  });
}

// Apps Script répond parfois en 9-12s (cold start) sans que ce soit une
// panne : timeout généreux, peu de retries.
async function fetchJSON_(url, retries = 2, timeoutMs = 15000) {
  for (let attempt = 0; attempt <= retries; attempt++) {
    try {
      return await xhrGet_(url, timeoutMs);
    } catch (e) {
      if (attempt === retries) throw e;
      await new Promise(r => setTimeout(r, 500 * (attempt + 1)));
    }
  }
}

// POST via XHR (même raison qu'en GET). Pas de retry : une écriture n'est
// pas sans risque à rejouer en double. Le backend renvoie { ok:false, error }
// en cas d'échec — on le transforme en exception pour que l'appelant affiche
// la vraie cause.
function postAction_(payload, timeoutMs = 20000) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', SCRIPT_URL);
    xhr.timeout = timeoutMs;
    xhr.onload = () => {
      if (xhr.status < 200 || xhr.status >= 300) return reject(new Error('HTTP ' + xhr.status));
      let res;
      try { res = JSON.parse(xhr.responseText); } catch (e) { res = { ok: true }; }
      if (res && res.ok === false) return reject(new Error(res.error || 'Erreur serveur'));
      resolve(res);
    };
    xhr.onerror = () => reject(new Error('Erreur réseau'));
    xhr.ontimeout = () => reject(new Error('Timeout'));
    xhr.send(JSON.stringify(payload));
  });
}

// ─── DONNÉES (cache) ───
//
// Toute l'app (passation, Offline, Historique) lit depuis _data, chargé en
// un seul appel au démarrage. Chaque appel Apps Script coûte ~2-3s fixes :
// on affiche immédiatement ce qu'on a déjà et on rafraîchit en arrière-plan,
// ce qui rend la navigation entre onglets instantanée.
const DATA_TTL_MS = 60000;
let _data = null;        // { passations (plus récente d'abord), entries (offline actuels), ts }
let _dataError = null;
let _dataPromise = null;
let _iotJournal = [];
let activeTab_ = 'form';

function setData_(passations, rawEntries) {
  _data = {
    passations: (passations || []).slice().sort((a,b) => new Date(b.Date) - new Date(a.Date)),
    entries: currentOpenIotEntries_(rawEntries),
    ts: Date.now()
  };
}

function fetchAll_(journal) {
  const q = journal ? '&withJournal=1' : '';
  return fetchJSON_(SCRIPT_URL + '?action=getAll' + q).then(d => {
    if (d && d.error && /Unknown action/.test(d.error)) {
      // Backend pas encore redéployé avec getAll : anciens endpoints.
      return Promise.all([
        fetchJSON_(SCRIPT_URL + '?action=getPassations'),
        fetchJSON_(SCRIPT_URL + '?action=getIoT' + q)
      ]).then(([a, b]) => ({ passations: a.passations, entries: b.entries, journal: b.journal }));
    }
    if (d && (d.ok === false || d.error)) throw new Error(d.error || 'Erreur serveur');
    return d;
  });
}

function loadData_(opts = {}) {
  const force = !!opts.force, journal = !!opts.journal;
  if (!force && !journal && _data && Date.now() - _data.ts < DATA_TTL_MS) return Promise.resolve(_data);
  if (_dataPromise && !journal) return _dataPromise;
  const p = fetchAll_(journal).then(d => {
    setData_(d.passations, d.entries);
    if (d.journal) _iotJournal = d.journal;
    _dataError = null;
    renderAll_();
    return _data;
  });
  if (!journal) {
    _dataPromise = p;
    const clear = () => { if (_dataPromise === p) _dataPromise = null; };
    p.then(clear, clear);
  }
  return p;
}

function onDataError_(e) {
  _dataError = (e && e.message) || String(e);
  if (_data) showToast('Actualisation impossible : ' + _dataError, 'error');
  renderAll_();
}

function retryData_() {
  _dataError = null;
  renderAll_();
  loadData_({ force: true }).catch(onDataError_);
}

function loadingOrErrorHTML_() {
  return _dataError
    ? `<div class="empty">Impossible de charger les données (${esc_(_dataError)}).<br><button class="r-nav-btn" style="margin-top:10px" onclick="retryData_()">Réessayer</button></div>`
    : '<div class="loading">Chargement...</div>';
}

function renderAll_() {
  renderFormOffline_();
  if (activeTab_ === 'history') renderHistory_();
  if (activeTab_ === 'iot') renderIoT();
}

// ─── PLANNING ───

  {d:'2026-09-07',n:'Jerome'},{d:'2026-09-14',n:'Antoine'},{d:'2026-09-21',n:'Martin'},{d:'2026-09-28',n:'Thierry'},
  {d:'2026-10-05',n:'Romain'},{d:'2026-10-12',n:'Jerome'},{d:'2026-10-19',n:'Antoine'},{d:'2026-10-26',n:'Martin'},
  {d:'2026-11-02',n:'Thierry'},{d:'2026-11-09',n:'Romain'},{d:'2026-11-16',n:'Jerome'},{d:'2026-11-23',n:'Antoine'},{d:'2026-11-30',n:'Martin'},
  {d:'2026-12-07',n:'Thierry'},{d:'2026-12-14',n:'Romain'},{d:'2026-12-21',n:'Jerome'},{d:'2026-12-28',n:'Antoine'}
];

function getAstreinte(date) {
  const d = new Date(date);
  const day = d.getDay();
  const monday = new Date(d);
  monday.setDate(d.getDate() - (day===0?6:day-1));
  const year = monday.getFullYear();
  const mo = String(monday.getMonth()+1).padStart(2,'0');
  const da = String(monday.getDate()).padStart(2,'0');
  const mondayStr = `${year}-${mo}-${da}`;
  const sorted = [...PLANNING].sort((a,b)=>a.d.localeCompare(b.d));
  let found = sorted[0];
  for (const e of sorted) { if (e.d <= mondayStr) found = e; else break; }
  return found ? {nom:found.n, tel:TEAM[found.n]?.tel||''} : null;
}

function initAstreinte() {
  const a = getAstreinte(new Date());
  if (a) {
    document.getElementById('astreinte-nom').textContent = a.nom;
    document.getElementById('astreinte-tel').textContent = a.tel;
    document.getElementById('astreinte').value = `${a.nom} (${a.tel})`;
  }
}

// ─── HELPERS ───
function esc_(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function jsStr_(s) { return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }
function attrJs_(s) { return esc_(jsStr_(s)); } // valeur JS dans un onclick="..."
function iotSafeId_(vn) { return 'iot-' + String(vn).replace(/[^a-zA-Z0-9]/g,'_'); }
function iotBatteryLabel_(v) { return (v!==''&&v!==undefined&&v!==null) ? v+'%' : '—'; }
function val_(id) { return document.getElementById(id).value.trim(); }

let _toastTimer = null;
function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast ' + type; t.style.display = 'block';
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => t.style.display = 'none', type === 'error' ? 7000 : 3500);
}

function fmtDateTime_(v, withYear) {
  const d = new Date(v);
  if (isNaN(d)) return String(v ?? '');
  return d.toLocaleDateString('fr-FR', withYear
    ? {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}
    : {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
}

// ─── TABS ───
function switchTab(tab) {
  activeTab_ = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + tab));
  window.scrollTo(0, 0);
  if (tab === 'iot') loadIoT();
  else {
    renderAll_();
    loadData_().catch(onDataError_);
  }
}

// ─── OFFLINE : sélection des entrées ───

// Déduplique par Vehicle Number en gardant la plus récente (priorité à
// "Last Import", repli sur "Last Seen") — filet de sécurité si la feuille
// contient encore des doublons historiques.
function dedupeIotByVehicle_(entries) {
  const t = v => { const d = new Date(v); return isNaN(d) ? 0 : d.getTime(); };
  const rank = e => t(e['Last Import']) || t(e['Last Seen']);
  const byVn = new Map();
  entries.forEach(e => {
    const vn = e['Vehicle Number'];
    const existing = byVn.get(vn);
    if (!existing || rank(e) >= rank(existing)) byVn.set(vn, e);
  });
  return Array.from(byVn.values());
}

// Ne garde que les entrées confirmées par le tout dernier import ("Last
// Import" n'est écrit que par l'import, pas par les actions manuelles qui ne
// touchent que "Last Seen").
function latestImportOnly_(entries) {
  if (!entries.length) return [];
  const t = v => { const d = new Date(v); return isNaN(d) ? 0 : d.getTime(); };
  const importTime = e => t(e['Last Import']) || t(e['Last Seen']);
  const maxImport = Math.max(...entries.map(importTime));
  return entries.filter(e => importTime(e) === maxImport);
}

// Point d'entrée unique pour "quels scooters sont offline en ce moment" —
// passation, WhatsApp, Offline et Historique affichent tous exactement ça.
function currentOpenIotEntries_(rawEntries) {
  const open = (rawEntries || []).filter(e => e.Resolved !== 'oui');
  return latestImportOnly_(dedupeIotByVehicle_(open));
}

function byHoursDesc_(list) {
  return list.slice().sort((a,b) => (parseFloat(b['Hours Since Signal'])||0) - (parseFloat(a['Hours Since Signal'])||0));
}
function availableSorted_(entries) { return byHoursDesc_(entries.filter(e => e.Group === 'A')); }

// Date du dernier import + alerte s'il date de plus de 4h (la liste offline
// n'est fiable que si quelqu'un a réimporté un export récent).
function lastImportInfo_(entries) {
  const t = v => { const d = new Date(v); return isNaN(d) ? 0 : d.getTime(); };
  const max = Math.max(0, ...entries.map(e => t(e['Last Import']) || t(e['Last Seen'])));
  if (!max) return null;
  const mins = Math.max(0, Math.round((Date.now() - max) / 60000));
  const ago = mins < 60 ? `${mins} min` : mins < 1440 ? `${Math.round(mins/60)} h` : `${Math.round(mins/1440)} j`;
  return { label: `${fmtDateTime_(max)} (il y a ${ago})`, stale: mins > 240 };
}

// Consigne terrain selon la batterie : sous le seuil, le scooter est
// sûrement juste déchargé à sa dernière position GPS → l'équipe terrain va
// swapper. Au-dessus, il devrait encore émettre : il faut le retrouver, et
// le dernier user est la meilleure source pour savoir où il l'a laissé.
const SWAP_THRESHOLD = 10;
function batteryNum_(e) {
  const n = parseFloat(String(e['Vehicle Battery'] ?? '').replace('%', '').replace(',', '.'));
  return isNaN(n) ? null : n;
}
function needsSwap_(e) { const b = batteryNum_(e); return b !== null && b < SWAP_THRESHOLD; }

function contactLine_(e) {
  if (e['Contact Joint'] === 'oui') return e['Lieu Indique'] ? `Laissé par l'user : "${e['Lieu Indique']}"` : 'User joint, lieu non précisé';
  if (e['Contact Joint'] === 'non') return 'User contacté, pas de réponse';
  return 'User pas encore contacté';
}
function contactClass_(e) {
  if (e['Contact Joint'] === 'oui' && e['Lieu Indique']) return 'ok';
  return e['Contact Joint'] === 'non' ? '' : 'todo';
}

// Adresse dans le message : uniquement celle saisie à la main, quand la
// personne qui fait la passation sait que le scooter n'est pas à sa
// position GPS. Sinon le lien carte (position GPS) suffit.
function adresseLine_(e) {
  return e['Adresse Reelle'] ? `Adresse réelle : ${e['Adresse Reelle']}` : '';
}

function adresseInputHTML_(e) {
  const real = e['Adresse Reelle'] || '';
  return `<input type="text" class="off-addr${real ? ' filled' : ''}" data-vn="${esc_(e['Vehicle Number'])}" placeholder="Adresse réelle (si différente)" value="${esc_(real)}" onchange="setIoTAdresse(this.dataset.vn, this.value)">`;
}


// ─── PASSATION ───
let _autoCreneau = '';

function setNow() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2,'0');
  const m = String(now.getMinutes()).padStart(2,'0');
  const d = String(now.getDate()).padStart(2,'0');
  const mo = String(now.getMonth()+1).padStart(2,'0');
  _autoCreneau = `${d}/${mo} ${h}h${m}`;
  document.getElementById('creneau').value = _autoCreneau;
  showErr('creneau', false);
}

function savePrenom(val) {
  try { localStorage.setItem('passshift_prenom', val); } catch(e) {}
}

function loadPrenom() {
  try {
    const saved = localStorage.getItem('passshift_prenom');
    if (saved) document.getElementById('creePar').value = saved;
  } catch(e) {}
}

function currentUser_() {
  try {
    const saved = localStorage.getItem('passshift_prenom');
    if (saved) return saved;
  } catch(e) {}
  const field = document.getElementById('creePar');
  return (field && field.value.trim()) || 'Inconnu';
}

function showErr(field, show) {
  const el = document.getElementById('err-'+field);
  if (el) el.classList.toggle('show', show);
}

function setStatus(key, value) {
  document.getElementById(key+'-val').value = value;
  document.getElementById(key+'-oui').className = 'status-btn'+(value==='oui'?' sel-oui':'');
  document.getElementById(key+'-non').className = 'status-btn'+(value==='non'?' sel-non':'');
  showErr(key, false);

function toggleTrips() {
  document.getElementById('trips-detail').classList.toggle('hidden', document.getElementById('trips-ok').checked);
}

// Bloc principal de la passation : nombre de scooters offline, liste des
// Available (exactement ce qui partira dans le message WhatsApp) et date du
// dernier import.
function renderFormOffline_() {
  // Ne pas reconstruire la liste pendant qu'une adresse est en cours de
  // saisie (une actualisation en arrière-plan effacerait la frappe).
  const focused = document.activeElement;
  if (focused && focused.classList.contains('off-addr') && document.getElementById('off-summary').contains(focused)) return;
  const info = document.getElementById('off-import-info');
  const box = document.getElementById('off-summary');
  document.getElementById('hero-count').textContent = _data ? availableSorted_(_data.entries).length : '';
  if (!_data) {
    info.className = 'off-import-info' + (_dataError ? ' stale' : '');
    info.textContent = _dataError ? 'Chargement impossible — ' + _dataError : 'Chargement…';
    box.innerHTML = _dataError ? `<button class="link-btn" style="padding:0 0 12px" onclick="retryData_()">Réessayer</button>` : '';
    return;
  }
  const entries = _data.entries;
  const imp = lastImportInfo_(entries);
  info.className = 'off-import-info' + (!imp || imp.stale ? ' stale' : '');
  info.textContent = imp
    ? `Dernier import : ${imp.label}${imp.stale ? ' — pense à réimporter' : ''}`
    : "Aucun import récent — importe l'export Atom";
  const avail = availableSorted_(entries);
  const swap = avail.filter(needsSwap_);
  const find = avail.filter(e => !needsSwap_(e));
  const toCall = find.filter(e => e['Contact Joint'] !== 'oui' && e['Contact Joint'] !== 'non');
  let html = `<div class="off-counts">
    <div><div class="off-count-num">${avail.length}</div><div class="off-count-label">Available offline</div></div>
    <div><div class="off-count-num dim">${entries.length - avail.length}</div><div class="off-count-label">Autres statuts</div></div>
  </div>`;
  if (toCall.length) {
    html += `<div class="off-warn">${toCall.length} scooter${toCall.length > 1 ? 's' : ''} à retrouver sans contact du dernier user : appelle-le pour savoir où il l'a laissé, puis note-le dans l'onglet Offline (ça part dans le message).</div>`;
  }
  // Chaque scooter a un champ "Adresse réelle" : c'est elle qui part dans le
  // message. L'adresse GPS (approximative) n'est qu'une suggestion en grisé.
  const item = (e, sub) => `<div class="off-item">
      <div class="off-row">
        <span class="off-since">${esc_(e['IoT Last Update'] || '—')}</span>
        <span class="off-name">${esc_(e['Vehicle Number'])}</span>
        <span class="off-meta">${esc_(iotBatteryLabel_(e['Vehicle Battery']))}</span>
      </div>
      ${sub ? `<div style="margin:-4px 0 8px">${sub}</div>` : ''}
      ${adresseInputHTML_(e)}
    </div>`;
  if (swap.length) {
    html += `<div class="off-group swap"><span>À swapper · &lt; ${SWAP_THRESHOLD}%</span><span>${swap.length}</span></div>
      <div class="off-list">${swap.map(e => item(e, '')).join('')}</div>`;
  }
  if (find.length) {
    html += `<div class="off-group find"><span>À retrouver · ≥ ${SWAP_THRESHOLD}%</span><span>${find.length}</span></div>
      <div class="off-list">${find.map(e => item(e,
        `<span class="off-sub ${contactClass_(e)}">${esc_(contactLine_(e))}</span>`)).join('')}</div>`;
  }
  if (entries.length) html += `<button class="link-btn" style="padding:0 0 12px" onclick="switchTab('iot')">Traiter dans l'onglet Offline →</button>`;
  box.innerHTML = html;
}

function validateForm_() {
  const checks = [
    ['creneau', !!val_('creneau')],
    ['creePar', !!val_('creePar')],
    ['idv', !!val_('idv-val')]
  ];
  let firstBad = null;
  checks.forEach(([field, ok]) => { showErr(field, !ok); if (!ok && !firstBad) firstBad = field; });
  if (firstBad) {
    document.getElementById('err-' + firstBad).scrollIntoView({ behavior: 'smooth', block: 'center' });
    return false;
  }
  return true;
}

// La passation sous la même forme que les lignes de la feuille "Passations",
// pour que le message WhatsApp se construise de la même façon depuis le
// formulaire et depuis l'historique.
function formPassation_() {
  const tripsOk = document.getElementById('trips-ok').checked;
  return {
    'Date': new Date().toISOString(),
    'Créneau': val_('creneau'),
    'Créé par': val_('creePar'),
    'Astreinte': val_('astreinte'),
    'ID Verification': val_('idv-val'),
    'ID Verification Comment': val_('idv-comment'),
    'TripsOk': tripsOk ? 'Oui' : 'Non',
    'Trips Detail': tripsOk ? '' : val_('trips-text'),
    'Message': val_('message')
  };
}

async function submitPassation() {
  // Un créneau pré-rempli automatiquement est remis à l'heure de l'envoi.
  if (val_('creneau') === _autoCreneau) setNow();
  if (!validateForm_()) return;
  const btn = document.getElementById('submit-btn');
  const label = btn.querySelector('span');
  btn.disabled = true; label.textContent = 'Envoi…';

  const p = formPassation_();
  let snap = null;
  await sendWhatsApp_(() => {
    snap = offlineSnapshot_(_data ? _data.entries : []);
    return buildWhatsAppText(p, snap);
  });

  try {
    const res = await postAction_({
      action: 'addPassation', date: p['Date'], creneau: p['Créneau'], ville: 'Bordeaux',
      astreinte: p['Astreinte'], creePar: p['Créé par'],
      idVerification: p['ID Verification'], idVerificationComment: p['ID Verification Comment'],
      tripsOk: p['TripsOk'], tripsDetail: p['Trips Detail'], message: p['Message'],
      offlineAvailable: snap.available, offlineTotal: snap.total, offlineListe: snap.liste
    });
    if (_data) {
      _data.passations.unshift(Object.assign({}, p, {
        ID: (res && res.id) || ('local-' + Date.now()),
        'Offline Available': snap.available, 'Offline Total': snap.total, 'Offline Liste': snap.liste
      }));
    }
    showToast('Passation enregistrée', 'success');
    resetForm_();
  } catch (e) {
    showToast("WhatsApp ouvert, mais l'enregistrement dans l'historique a échoué (" + e.message + "). Réessaie.", 'error');
  }
  btn.disabled = false; label.textContent = 'Envoyer la passation sur WhatsApp';
}

function resetForm_() {
  ['message','idv-comment','trips-text','idv-val'].forEach(id => { document.getElementById(id).value = ''; });
  ['idv-oui','idv-non'].forEach(id => { document.getElementById(id).className = 'status-btn'; });
  document.getElementById('trips-ok').checked = false;
  toggleTrips();
  setNow();
  window.scrollTo(0, 0);
}

// ─── WHATSAPP ───
const WA_SEP = '__________________________\n';

// Bloc offline du message, rédigé comme une consigne pour le terrain :
// deux groupes (à swapper / à retrouver), l'adresse réelle seulement si elle
// a été saisie, plus, pour ceux à retrouver, ce que le dernier user a dit.
// Pas de lien carte (le terrain a la position dans Atom), pas d'emoji.
function offlineSnapshot_(entries) {
  const avail = availableSorted_(entries);
  const swap = avail.filter(needsSwap_);
  const find = avail.filter(e => !needsSwap_(e));
  const head = e => `- ${e['Vehicle Number']} · ${iotBatteryLabel_(e['Vehicle Battery'])} · offline depuis ${e['IoT Last Update'] || '—'}`;
  const lines = [];
  if (!avail.length) lines.push('Aucun');
  if (swap.length) {
    lines.push(`A SWAPPER — batterie < ${SWAP_THRESHOLD}% (${swap.length})`);
    lines.push('-> Terrain : aller swapper la batterie sur place');
    swap.forEach(e => {
      lines.push(head(e));
      if (adresseLine_(e)) lines.push(`   ${adresseLine_(e)}`);
    });
  }
  if (find.length) {
    if (swap.length) lines.push('');
    lines.push(`A RETROUVER — batterie >= ${SWAP_THRESHOLD}% (${find.length})`);
    lines.push('-> Terrain : aller sur place, retrouver le scooter et le remettre en service');
    find.forEach(e => {
      lines.push(head(e));
      if (adresseLine_(e)) lines.push(`   ${adresseLine_(e)}`);
      lines.push(`   ${contactLine_(e)}`);
      if (e['Position Check'] === 'ne_correspond_pas') lines.push('   Attention : la position GPS ne correspond pas');
    });
  }
  return { available: avail.length, total: entries.length, liste: lines.join('\n') };
}

// Une passation enregistrée garde la liste offline du moment où elle a été
// envoyée ; les anciennes (avant cet enregistrement) retombent sur la liste
// actuelle.
function snapshotFor_(p) {
  if (p['Offline Available'] !== undefined && p['Offline Available'] !== '') {
    return { available: p['Offline Available'], total: p['Offline Total'], liste: p['Offline Liste'] || '' };
  }
  return offlineSnapshot_(_data ? _data.entries : []);
}

function buildWhatsAppText(p, snap) {
  const date = new Date(p.Date);
  const dateStr = isNaN(date) ? p.Date : fmtDateTime_(date, true);
  const creneau = safeCreneau_(p['Créneau']);
  const astrData = getAstreinte(isNaN(date) ? new Date() : date);
  const astrText = astrData ? `${astrData.nom} (${astrData.tel})` : (p.Astreinte || '—');
  let t = `PASS'SHIFT eDOG - Bordeaux\n` + WA_SEP;
  t += `${dateStr}${creneau ? ' - ' + creneau : ''}\n`;
  t += `Par : ${p['Créé par'] || '—'}  |  Astreinte : ${astrText}\n`;
  t += WA_SEP;
  t += `SCOOTERS OFFLINE — Available (${snap.available})\n\n`;
  t += (snap.liste ? snap.liste : 'Aucun') + '\n';
  t += WA_SEP;
  if (p['ID Verification']) {
    t += `ID verification à jour : ${p['ID Verification']==='oui' ? 'Oui' : 'Non'}${p['ID Verification Comment'] ? ' (' + p['ID Verification Comment'] + ')' : ''}\n`;
  }
  if (p.TripsOk === 'Non' && p['Trips Detail']) t += `Trips longs : ${p['Trips Detail']}\n`;
  if (p.Message) t += WA_SEP + p.Message + '\n';
  return t;
}

function waUrl_(text) { return 'https://wa.me/?text=' + encodeURIComponent(text); }

// window.open() doit être appelé de façon SYNCHRONE dans le clic, sinon le
// navigateur le bloque comme popup sans rien afficher. Les données sont
// normalement déjà en mémoire : le message se construit et s'ouvre tout de
// suite. Sinon on ouvre un onglet vide immédiatement et on le redirige une
// fois les données chargées.
async function sendWhatsApp_(buildText) {
  if (_data) {
    const url = waUrl_(buildText());
    if (!window.open(url, '_blank')) location.href = url;
    return;
  }
  const popup = window.open('', '_blank');
  try { await loadData_(); } catch (e) {}
  const url = waUrl_(buildText());
  if (popup && !popup.closed) popup.location.href = url;
  else location.href = url;
}

function sendHistoryWhatsApp(id) {
  const p = _data && _data.passations.find(x => String(x.ID) === String(id));
  if (!p) return;
  sendWhatsApp_(() => buildWhatsAppText(p, snapshotFor_(p)));
}

// ─── OFFLINE (onglet) ───

// Parse un texte relatif type "2 days", "1 week", "45 minutes" en heures
// décimales, pour trier par priorité (le plus vieux signal en tête).
function parseIoTHours_(text) {
  if (!text) return null;
  const m = String(text).match(/(\d+(?:[.,]\d+)?)\s*(minute|min|hour|hr|h|day|d|week|wk|w|month|mo|year|yr|y)s?\b/i);
  if (!m) return null;
  const n = parseFloat(m[1].replace(',', '.'));
  const mult = {
    minute:1/60, min:1/60,
    hour:1, hr:1, h:1,
    day:24, d:24,
    week:24*7, wk:24*7, w:24*7,
    month:24*30, mo:24*30,
    year:24*365, yr:24*365, y:24*365
  };
  const unit = m[2].toLowerCase();
  return Math.round(n * (mult[unit] ?? 1) * 10) / 10;
}

// Normalise une valeur de date issue du fichier Atom importé : objet Date
// (cellule typée date, avec cellDates:true), nombre de série Excel, ou
// chaîne déjà lisible. Stockée en ISO pour que le round-trip Sheets ne la
// déforme pas ; formatée uniquement à l'affichage (fmtLastRide_).
function excelSerialToDate_(serial) {
  const epoch = Date.UTC(1899, 11, 30); // point de référence Excel (avec le bug de l'an 1900)
  return new Date(epoch + serial * 86400000);
}
function formatIoTDate_(v) {
  if (v === '' || v === undefined || v === null) return '';
  let d = null;
  if (v instanceof Date) d = v;
  else if (typeof v === 'number' && isFinite(v)) d = excelSerialToDate_(v);
  if (d && !isNaN(d)) return d.toISOString();
  return String(v).trim();
}
function fmtLastRide_(v) {
  if (v === '' || v === undefined || v === null) return '—';
  let d = null;
  if (typeof v === 'number' && isFinite(v)) d = excelSerialToDate_(v);
  else { const parsed = new Date(v); if (!isNaN(parsed)) d = parsed; }
  return (d && !isNaN(d)) ? fmtDateTime_(d, true) : String(v).trim();
}

// ─── PROGRESSION DE L'IMPORT ───
//
// L'import est un seul appel serveur : Apps Script ne peut pas renvoyer
// d'avancement en cours de route. La barre suit donc les étapes réelles côté
// navigateur (lecture du fichier, envoi, réponse) et, pendant le traitement
// serveur, avance selon une estimation. Elle ne passe à 100% qu'à la vraie
// réponse du serveur.
let _ip = null;

function ipSet_(pct, label) {
  document.getElementById('ip-fill').style.width = Math.round(pct) + '%';
  if (label !== undefined) document.getElementById('ip-label').textContent = label;
}

function importProgressStart_() {
  if (_ip) { clearInterval(_ip.timer); clearTimeout(_ip.hide); }
  const el = document.getElementById('import-progress');
  el.className = 'import-progress';
  _ip = { t0: Date.now(), phase: null };
  ipSet_(3, 'Lecture du fichier…');
  _ip.timer = setInterval(() => {
    const secs = Math.round((Date.now() - _ip.t0) / 1000);
    document.getElementById('ip-time').textContent = secs + ' s';
    if (!_ip.phase) return;
    const t = Date.now() - _ip.phase.t0;
    const { est, nRows } = _ip.phase;
    const pct = 12 + 83 * (1 - Math.exp(-2 * t / est)); // tend vers 95% sans jamais l'atteindre
    ipSet_(pct, t < 1500 ? `Envoi de ${nRows} scooters…` : 'Mise à jour de la liste offline…');
  }, 200);
}

function importProgressSending_(nRows) {
  if (!_ip) return;
  ipSet_(12, `Envoi de ${nRows} scooters…`);
  _ip.phase = { t0: Date.now(), est: 4000 + nRows * 20, nRows };
}

function importProgressEnd_(ok, label) {
  if (!_ip) return;
  clearInterval(_ip.timer);
  const el = document.getElementById('import-progress');
  el.className = 'import-progress ' + (ok ? 'done' : 'error');
  ipSet_(100, label);
  const ip = _ip;
  ip.hide = setTimeout(() => { if (_ip === ip) { el.classList.add('hidden'); _ip = null; } }, ok ? 5000 : 9000);
}

function handleIoTFileSelect(event) {
  const file = event.target.files[0];
  event.target.value = ''; // permet de réimporter le même fichier plus tard si besoin
  if (!file) return;
  importProgressStart_();
  const isCsv = /\.csv$/i.test(file.name);
  const reader = new FileReader();
  reader.onload = async (e) => {
    let rows;
    try {
      const workbook = isCsv
        ? XLSX.read(e.target.result, { type: 'string', cellDates: true })
        : XLSX.read(new Uint8Array(e.target.result), { type: 'array', cellDates: true });
      rows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { defval: '' });
    } catch (err) {
      importProgressEnd_(false, 'Fichier illisible : ' + err.message);
      return;
    }
    await submitIoTImport(rows);
  };
  reader.onerror = () => importProgressEnd_(false, 'Impossible de lire le fichier');
  if (isCsv) reader.readAsText(file); else reader.readAsArrayBuffer(file);
}

function setImportBusy_(busy) {
  document.querySelectorAll('[data-import-btn]').forEach(b => {
    b.disabled = busy;
    const span = b.querySelector('span');
    if (!span.dataset.label) span.dataset.label = span.textContent;
    span.textContent = busy ? 'Import en cours…' : span.dataset.label;
  });
}

async function submitIoTImport(rawRows) {
  // Si l'export liste un même véhicule plusieurs fois, on ne garde que la
  // dernière occurrence.
  const byVn = new Map();
  rawRows.forEach(r => {
    const vn = String(r['Vehicle number'] || '').trim();
    if (!vn) return;
    const status = String(r['Vehicle status'] || '').trim();
    const lastUpdate = String(r['IoT last update'] || '').trim();
    byVn.set(vn, {
      vehicleNumber: vn,
      group: status === 'Available' ? 'A' : 'B',
      status: status,
      battery: r['Vehicle battery'],
      iotLastUpdate: lastUpdate,
      hoursSinceSignal: parseIoTHours_(lastUpdate),
      lat: r['Latitude'],
      lng: r['Longitude'],
      lastRide: formatIoTDate_(r['Last ride'])
    });
  });
  const rows = Array.from(byVn.values());
  if (!rows.length) { importProgressEnd_(false, "Aucune ligne exploitable (colonne 'Vehicle number' vide ?)"); return; }

  setImportBusy_(true);
  importProgressSending_(rows.length);
  try {
    const res = await postAction_({ action: 'importIoT', importedBy: currentUser_(), rows }, 180000);
    importProgressEnd_(true, `Import terminé — ${res.added} nouveau(x), ${res.updated} mis à jour, ${res.autoResolved} revenu(s) en ligne`);
    if (res.entries && _data) {
      // Le backend renvoie directement la liste à jour : pas de relecture.
      _data.entries = currentOpenIotEntries_(res.entries);
      renderAll_();
      if (activeTab_ === 'iot') loadData_({ journal: true }).catch(onDataError_);
    } else {
      await loadData_({ force: true, journal: activeTab_ === 'iot' }).catch(onDataError_);
    }
  } catch (e) {
    importProgressEnd_(false, "Échec de l'import : " + e.message + " — il a peut-être abouti, vérifie avec Actualiser avant de réimporter");
  }
  setImportBusy_(false);
}

function loadIoT() {

  const done = () => btn.classList.remove('spinning');

  html += groupB.length ? groupB.map(renderIoTCardB_).join('') : '<div class="live-empty">Aucun</div>';
  content.innerHTML = html;

function renderIoTCardA_(e) {
  const vn = e['Vehicle Number'];
  const safeId = iotSafeId_(vn);
  const posCheck = e['Position Check'] || 'non_verifie';
  const contactJoint = e['Contact Joint'] || '';
  const v = attrJs_(vn);
  const swap = needsSwap_(e);
  // Pour un scooter à retrouver, le dernier user est la meilleure piste :
  // le bloc contact est toujours affiché (pas seulement si la position GPS
  // ne correspond pas).
  const showContact = !swap || posCheck === 'ne_correspond_pas';
  return `<div class="iot-card priority">
    <span class="cat-badge ${swap ? 'swap' : 'find'}">${swap ? 'À swapper' : 'À retrouver'}</span>
    <div class="iot-card-top">
      <div>
        <div class="iot-card-vn">${esc_(vn)}</div>
        <div class="iot-card-meta">Sans signal depuis <strong>${esc_(e['IoT Last Update'] || '—')}</strong> · dernier ride : ${esc_(fmtLastRide_(e['Last Ride']))}</div>
      </div>
      <div class="iot-card-battery">${esc_(iotBatteryLabel_(e['Vehicle Battery']))}</div>
    </div>
    <div style="margin-bottom:10px">${adresseInputHTML_(e)}</div>
    <div class="iot-3way">
      <button class="${posCheck==='correspond'?'sel-correspond':''}" onclick="setIoTPosition('${v}','correspond')">Correspond</button>
      <button class="${posCheck==='ne_correspond_pas'?'sel-ne_correspond_pas':''}" onclick="setIoTPosition('${v}','ne_correspond_pas')">Ne correspond pas</button>
      <button class="${posCheck==='non_verifie'?'sel-non_verifie':''}" onclick="setIoTPosition('${v}','non_verifie')">Non vérifié</button>
    </div>
    ${showContact ? `
    <div class="iot-contact-block">
      <div class="iot-contact-label">Dernier user — où a-t-il laissé le scooter ?</div>
      <div class="iot-contact-toggle">
        <button class="${contactJoint==='oui'?'sel-oui':''}" onclick="setIoTContact('${v}','oui')">Joint</button>
        <button class="${contactJoint==='non'?'sel-non':''}" onclick="setIoTContact('${v}','non')">Non joint</button>
      </div>
      ${contactJoint==='oui' ? `<input type="text" class="iot-lieu-input" placeholder="Où l'user dit l'avoir laissé (ex : devant le 12 rue Sainte-Catherine)" value="${esc_(e['Lieu Indique'] || '')}" onchange="setIoTLieu('${v}', this.value)">` : ''}
    </div>` : ''}
    <div class="iot-card-actions">
      <button class="iot-resolve-btn" onclick="setIoTResolved('${v}')">Marquer résolu</button>
      <button class="iot-journal-toggle" onclick="toggleIoTJournal('${safeId}')">Historique</button>
    </div>
    <div class="iot-journal hidden" id="journal-${safeId}">${iotJournalHTML_(vn)}</div>
  </div>`;
}

function renderIoTCardB_(e) {
  const vn = e['Vehicle Number'];
  const safeId = iotSafeId_(vn);
  return `<div class="iot-simple-row" style="flex-wrap:wrap">
    <div class="iot-simple-info"><strong>${esc_(vn)}</strong> · ${esc_(e['Vehicle Status'] || '—')} · ${esc_(iotBatteryLabel_(e['Vehicle Battery']))} · depuis ${esc_(e['IoT Last Update'] || '—')}</div>
    <div style="display:flex;gap:6px">
      <button class="iot-journal-toggle" onclick="toggleIoTJournal('${safeId}')">Historique</button>
      <button class="iot-resolve-btn" style="flex:none;padding:7px 12px" onclick="setIoTResolved('${attrJs_(vn)}')">Résolu</button>
    </div>
    <div class="iot-journal hidden" id="journal-${safeId}" style="width:100%">${iotJournalHTML_(vn)}</div>
  </div>`;
}

function findEntry_(vn) {
  return _data ? _data.entries.find(x => String(x['Vehicle Number']) === String(vn)) : null;
}

// Les actions mettent à jour l'affichage tout de suite, puis l'écriture part
// en arrière-plan ; en cas d'échec on recharge la vérité depuis la feuille.
function iotWrite_(payload) {
  postAction_(Object.assign({ action: 'updateIoT', by: currentUser_() }, payload))
    .catch(err => {
      showToast('Erreur : ' + err.message, 'error');
      loadData_({ force: true, journal: true }).catch(onDataError_);
    });
}

function setIoTPosition(vn, value) {
  const e = findEntry_(vn);
  if (e) e['Position Check'] = value;
  renderAll_();
  iotWrite_({ type: 'position', vehicleNumber: vn, value });
}

function setIoTContact(vn, contactJoint) {
  const e = findEntry_(vn);
  const lieu = contactJoint === 'oui' ? (e ? e['Lieu Indique'] || '' : '') : '';
  if (e) { e['Contact Joint'] = contactJoint; e['Lieu Indique'] = lieu; }
  renderAll_();
  iotWrite_({ type: 'contact', vehicleNumber: vn, contactJoint, lieuIndique: lieu });
}

function setIoTLieu(vn, lieu) {
  const e = findEntry_(vn);
  if (e) e['Lieu Indique'] = lieu;
  renderFormOffline_();
  iotWrite_({ type: 'contact', vehicleNumber: vn, contactJoint: 'oui', lieuIndique: lieu });
}

// Pas de re-rendu ici : l'utilisateur enchaîne souvent les adresses d'un
// champ à l'autre, reconstruire la liste lui ferait perdre le focus.
function setIoTAdresse(vn, adresse) {
  const e = findEntry_(vn);
  adresse = adresse.trim();
  if (e) e['Adresse Reelle'] = adresse;
  document.querySelectorAll('.off-addr').forEach(inp => {
    if (inp.dataset.vn === String(vn)) {
      inp.value = adresse;
      inp.classList.toggle('filled', !!adresse);
    }
  });
  iotWrite_({ type: 'adresse', vehicleNumber: vn, adresse });
}

function setIoTResolved(vn) {
  if (_data) _data.entries = _data.entries.filter(x => String(x['Vehicle Number']) !== String(vn));
  renderAll_();
  showToast(vn + ' marqué résolu', 'success');
  iotWrite_({ type: 'resolved', vehicleNumber: vn, resolved: true });
}

// ─── INIT ───
initAstreinte();
loadPrenom();
setNow();
renderFormOffline_();
loadData_().catch(onDataError_);
</script>
</body>
</html>
